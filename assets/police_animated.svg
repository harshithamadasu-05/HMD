<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
    <defs>
        <!-- Gradients -->
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
            <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="50%" stop-color="#cbd5e1" />
            <stop offset="100%" stop-color="#ffffff" />
        </linearGradient>
        <linearGradient id="policeWhite" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#475569" />
        </linearGradient>
    </defs>

    <style>
        /* CSS Animations within SVG */
        @keyframes scanLeftRight {
            0% { transform: translateX(-40px); }
            50% { transform: translateX(40px); }
            100% { transform: translateX(-40px); }
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
        @keyframes radarExpand {
            0% { r: 10px; opacity: 0.8; }
            100% { r: 300px; opacity: 0; }
        }
        @keyframes flashRed {
            0%, 100% { fill: #ef4444; filter: drop-shadow(0 0 2px #ef4444); }
            50% { fill: #7f1d1d; filter: none; }
        }
        @keyframes flashWhite {
            0%, 100% { fill: #475569; filter: none; }
            50% { fill: #ffffff; filter: drop-shadow(0 0 15px #ffffff); }
        }
        @keyframes gridScroll {
            0% { transform: translateY(0); }
            100% { transform: translateY(40px); }
        }

        /* Classes */
        .grid-line {
            stroke: #1e293b;
            stroke-width: 1;
        }
        .scrolling-grid {
            animation: gridScroll 2s linear infinite;
        }
        .radar {
            fill: none;
            stroke: #ffffff;
            stroke-width: 1.5;
            transform-origin: 600px 320px;
            animation: radarExpand 4s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
        }
        .radar-delayed {
            animation-delay: 2s;
        }
        .laser-eye {
            animation: scanLeftRight 3s ease-in-out infinite;
        }
        .neon-glow {
            animation: pulseGlow 4s ease-in-out infinite;
        }
        .light-red {
            animation: flashRed 0.8s infinite;
        }
        .light-white {
            animation: flashWhite 0.8s infinite;
        }
    </style>

    <!-- Ambient Glow Background -->
    <rect width="100%" height="100%" fill="#0b0f19" />
    <circle cx="600" cy="400" r="500" fill="url(#glow)" />

    <!-- Animated Cyber Grid -->
    <g class="scrolling-grid">
        <!-- Horizontal Grid Lines -->
        <line x1="0" y1="100" x2="1200" y2="100" class="grid-line" />
        <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
        <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
        <line x1="0" y1="220" x2="1200" y2="220" class="grid-line" />
        <line x1="0" y1="260" x2="1200" y2="260" class="grid-line" />
        <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
        <line x1="0" y1="340" x2="1200" y2="340" class="grid-line" />
        <line x1="0" y1="380" x2="1200" y2="380" class="grid-line" />
        <line x1="0" y1="420" x2="1200" y2="420" class="grid-line" />
        <line x1="0" y1="460" x2="1200" y2="460" class="grid-line" />
        <line x1="0" y1="500" x2="1200" y2="500" class="grid-line" />
        <line x1="0" y1="540" x2="1200" y2="540" class="grid-line" />
        <line x1="0" y1="580" x2="1200" y2="580" class="grid-line" />
        <line x1="0" y1="620" x2="1200" y2="620" class="grid-line" />
        <line x1="0" y1="660" x2="1200" y2="660" class="grid-line" />
        <line x1="0" y1="700" x2="1200" y2="700" class="grid-line" />
        <line x1="0" y1="740" x2="1200" y2="740" class="grid-line" />
        <line x1="0" y1="780" x2="1200" y2="780" class="grid-line" />
    </g>

    <!-- Vertical Grid Lines (Perspective Style) -->
    <g>
        <line x1="600" y1="0" x2="100" y2="800" class="grid-line" opacity="0.5" />
        <line x1="600" y1="0" x2="300" y2="800" class="grid-line" opacity="0.5" />
        <line x1="600" y1="0" x2="500" y2="800" class="grid-line" opacity="0.5" />
        <line x1="600" y1="0" x2="700" y2="800" class="grid-line" opacity="0.5" />
        <line x1="600" y1="0" x2="900" y2="800" class="grid-line" opacity="0.5" />
        <line x1="600" y1="0" x2="1100" y2="800" class="grid-line" opacity="0.5" />
    </g>

    <!-- Radar Waves emanating from the cyber-police -->
    <circle cx="600" cy="320" r="10" class="radar" />
    <circle cx="600" cy="320" r="10" class="radar radar-delayed" />

    <!-- Stylized Futuristic Animated Policeman (HUD Silhouette in White) -->
    <g transform="translate(0, 50)">
        <!-- Shoulder Pads / Armor -->
        <path d="M 400 550 L 520 420 L 680 420 L 800 550 Z" fill="url(#policeWhite)" opacity="0.8" stroke="#ffffff" stroke-width="2" />
        
        <!-- Chest Plate details -->
        <path d="M 540 420 L 600 480 L 660 420" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6" />
        <line x1="600" y1="480" x2="600" y2="550" stroke="#ffffff" stroke-width="2" opacity="0.5" />

        <!-- Flashing Police shoulder lights -->
        <!-- Left Shoulder Red Light -->
        <circle cx="430" cy="510" r="12" class="light-red" />
        <circle cx="430" cy="510" r="25" fill="#ef4444" opacity="0.15" class="neon-glow" />
        
        <!-- Right Shoulder White Light -->
        <circle cx="770" cy="510" r="12" class="light-white" />
        <circle cx="770" cy="510" r="25" fill="#ffffff" opacity="0.15" class="neon-glow" />

        <!-- Neck -->
        <rect x="575" y="380" width="50" height="50" rx="5" fill="#1e293b" stroke="#ffffff" stroke-width="1.5" />

        <!-- Helmet -->
        <path d="M 520 330 C 520 220, 680 220, 680 330 C 680 370, 670 390, 660 400 L 540 400 C 530 390, 520 370, 520 330 Z" fill="#0f172a" stroke="#ffffff" stroke-width="2.5" />
        
        <!-- Helmet Ear protections / cyber gear -->
        <rect x="508" y="310" width="15" height="40" rx="5" fill="#334155" stroke="#ffffff" stroke-width="1" />
        <rect x="677" y="310" width="15" height="40" rx="5" fill="#334155" stroke="#ffffff" stroke-width="1" />

        <!-- Glowing Visor (Policed Scanner) -->
        <path d="M 535 315 L 665 315 C 670 335, 670 345, 665 350 L 535 350 C 530 345, 530 335, 535 315 Z" fill="#111" stroke="#ffffff" stroke-width="2" />
        
        <!-- Animated Visor Scanner Sweeper -->
        <g transform="translate(600, 332.5)">
            <rect x="-25" y="-12.5" width="50" height="25" rx="5" fill="url(#visorGrad)" opacity="0.8" class="laser-eye" />
            <circle cx="0" cy="0" r="8" fill="#ffffff" class="laser-eye" filter="drop-shadow(0 0 5px #ffffff)" />
        </g>
    </g>

    <!-- Forefront Digital HUD Ring -->
    <circle cx="600" cy="370" r="280" fill="none" stroke="#1e293b" stroke-dasharray="10 15" stroke-width="1.5" />
    <circle cx="600" cy="370" r="290" fill="none" stroke="#ffffff" stroke-dasharray="40 180" stroke-width="2" opacity="0.6" />
</svg>
